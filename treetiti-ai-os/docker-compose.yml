# TREEtiti AI Marketing OS — Docker Compose
# Runs PostgreSQL (+pgvector), the FastAPI backend and n8n.
# The AI brain uses the local `opencode` CLI (host-side), which needs `--network host`-like access.
# Launch:  docker compose up -d
# Then visit:
#   Backend API docs: http://localhost:8000/docs
#   n8n:              http://localhost:5678

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: treetiti-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: treetiti
      POSTGRES_PASSWORD: treetiti
      POSTGRES_DB: treetiti_ai_os
    ports:
      # 5433 on the host (5432 may be taken by an existing Postgres)
      - "5433:5432"
    volumes:
      - treetiti_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treetiti -d treetiti_ai_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Context is the repo root so the multi-stage Dockerfile can build the frontend.
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: treetiti-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Inside the compose network the DB is the `db` service.
      DATABASE_URL: postgresql+psycopg://treetiti:treetiti@db:5432/treetiti_ai_os
      # The backend reaches the host's opencode CLI + Ollama via host network.
      OPENCODE_DIR: /app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  n8n:
    image: n8nio/n8n:latest
    container_name: treetiti-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      DB_TYPE: sqlite
      N8N_DIAGNOSTICS_ENABLED: "false"
    ports:
      - "5678:5678"
    volumes:
      - treetiti_n8n:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows

volumes:
  treetiti_pgdata:
  treetiti_n8n:
