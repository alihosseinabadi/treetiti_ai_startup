<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Treetiti — Chief of Staff</title>
<style>
*{box-sizing:border-box;font-family:ui-sans-serif,-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif}
html,body{margin:0;height:100%;background:#212121;color:#ececec}
#app{display:flex;height:100vh;overflow:hidden}
/* ---------- sidebar ---------- */
#side{width:260px;flex-shrink:0;background:#171717;display:flex;flex-direction:column;padding:12px 8px;z-index:30}
#side .stop{display:flex;align-items:center;gap:4px;padding:0 4px 8px}
.iconbtn{border:none;background:none;color:#ececec;border-radius:8px;width:36px;height:36px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn:hover{background:#2f2f2f}
#newchat{flex:1;display:flex;align-items:center;gap:10px;background:none;border:none;color:#ececec;font-size:14px;padding:9px 10px;border-radius:10px;cursor:pointer;text-align:left}
#newchat:hover{background:#2f2f2f}
#searchbox{margin:2px 4px 8px;background:none;border:1px solid transparent;border-radius:10px;color:#ececec;font-size:13px;padding:8px 10px;width:calc(100% - 8px);outline:none}
#searchbox::placeholder{color:#8e8e8e}
#searchbox:focus{border-color:#424242;background:#212121}
#hist{flex:1;overflow-y:auto;padding:2px 0}
.hsec{font-size:12px;font-weight:600;color:#9a9a9a;padding:14px 10px 4px}
.hrow{display:flex;align-items:center;gap:6px;width:100%;background:none;border:none;color:#ececec;font-size:13.5px;padding:8px 10px;border-radius:10px;cursor:pointer;text-align:left}
.hrow:hover{background:#2f2f2f}
.hrow.on{background:#2f2f2f}
.hrow span.tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .ha{display:none;gap:2px}
.hrow:hover .ha{display:flex}
.ha button{border:none;background:none;color:#b4b4b4;font-size:13px;cursor:pointer;border-radius:6px;padding:2px 5px}
.ha button:hover{background:#424242;color:#fff}
.side-foot{border-top:1px solid #2f2f2f;padding-top:8px}
.toolrow{display:flex;gap:4px;padding:2px 4px 6px}
.toolrow .tbtn{flex:1}
.userrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:13.5px}
.userrow:hover{background:#2f2f2f}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#6EA8FF,#3B82F6);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
#scrim{display:none}
/* ---------- main ---------- */
main{flex:1;display:flex;flex-direction:column;min-width:0;background:#212121}
header{display:flex;align-items:center;gap:6px;padding:10px 14px}
#burger{display:none}
.mname{font-size:17px;font-weight:600;color:#ececec;background:none;border:none;border-radius:8px;padding:6px 10px;cursor:pointer}
.mname:hover{background:#2f2f2f}
.mname small{color:#8e8e8e;font-weight:400;font-size:12px}
.hsp{flex:1}
#threadwrap{flex:1;overflow-y:auto;display:flex;flex-direction:column}
#thread{width:100%;max-width:760px;margin:0 auto;padding:10px 20px 20px;display:flex;flex-direction:column;gap:22px}
.umsg{align-self:flex-end;background:#2f2f2f;color:#ececec;border-radius:24px;padding:10px 20px;font-size:15px;line-height:1.65;max-width:80%;white-space:pre-wrap;word-break:break-word}
.amsg{align-self:stretch;color:#ececec;font-size:15px;line-height:1.75;word-break:break-word;min-width:0}
.amsg p{margin:0 0 12px}.amsg p:last-child{margin-bottom:0}
.amsg h1,.amsg h2,.amsg h3{margin:18px 0 8px;line-height:1.3}
.amsg h1{font-size:22px}.amsg h2{font-size:18px}.amsg h3{font-size:16px}
.amsg ul,.amsg ol{margin:0 0 12px;padding-left:24px}
.amsg li{margin:4px 0}
.amsg code{background:#2f2f2f;border-radius:6px;padding:2px 6px;font-size:13.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
.amsg pre{background:#171717;border:1px solid #2f2f2f;border-radius:12px;padding:14px;overflow-x:auto;margin:0 0 12px}
.amsg pre code{background:none;padding:0;font-size:13px;line-height:1.6}
.amsg blockquote{border-left:3px solid #6EA8FF;margin:0 0 12px;padding:4px 0 4px 14px;color:#c9c9c9}
.amsg table{border-collapse:collapse;margin:0 0 12px;width:100%;font-size:14px}
.amsg th,.amsg td{border:1px solid #424242;padding:8px 12px;text-align:left}
.amsg th{background:#2f2f2f}
.cursor{display:inline-block;width:9px;height:18px;background:#ececec;border-radius:2px;vertical-align:-3px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.abtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.abtn{font-size:13px;padding:8px 16px;border-radius:20px;border:1px solid #565656;background:transparent;color:#ececec;cursor:pointer}
.abtn:hover{background:#2f2f2f;border-color:#8e8e8e}
.abtn.primary{background:#fff;color:#111;border-color:#fff;font-weight:600}
.abtn.primary:hover{background:#e2e2e2}
/* question cards + summary */
.qcard{background:#2f2f2f;border:1px solid #424242;border-radius:14px;padding:12px 14px;font-size:13.5px;max-width:100%;color:#ececec;margin-top:4px}
.qcard input{width:100%;font-size:13px;padding:8px 10px;border-radius:9px;border:1px solid #565656;margin-top:8px;background:#212121;color:#ececec;outline:none}
.qcard input:focus{border-color:#6EA8FF}
.sumcard{background:#2f2f2f;border:1px solid #424242;border-radius:14px;padding:6px 0;margin-top:4px;font-size:13.5px}
.sumrow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid #424242}
.sumrow:last-child{border-bottom:none}
.sumrow .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#8e8e8e;flex-shrink:0;min-width:70px}
.sumrow .v{flex:1;color:#ececec;word-break:break-word}
.sumrow button{background:none;border:none;color:#6EA8FF;font-size:12.5px;cursor:pointer;flex-shrink:0}
.sumrow button:hover{text-decoration:underline}
/* empty state */
#empty{width:100%;max-width:760px;margin:auto;padding:20px;display:flex;flex-direction:column;align-items:center}
#empty h1{font-size:30px;font-weight:600;margin:0 0 26px;text-align:center}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.sugg button{background:none;border:1px solid #424242;border-radius:16px;padding:14px 16px;color:#c9c9c9;font-size:13.5px;cursor:pointer;text-align:left;line-height:1.5}
.sugg button:hover{background:#2f2f2f}
.sugg button b{display:block;color:#ececec;font-weight:600;margin-bottom:2px}
/* composer */
#composerwrap{padding:6px 14px 10px;background:#212121}
#composerbox{max-width:760px;margin:0 auto}
#attachrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#composer{background:#2f2f2f;border-radius:28px;padding:10px 8px 8px 6px;display:flex;align-items:flex-end;gap:4px}
#composer:focus-within{box-shadow:0 0 0 1px #565656}
#plus{width:36px;height:36px;flex-shrink:0}
#t{flex:1;background:none;border:none;outline:none;resize:none;color:#ececec;font-size:15px;line-height:1.55;max-height:200px;padding:7px 4px;font-family:inherit}
#t::placeholder{color:#8e8e8e}
#send{width:36px;height:36px;border-radius:50%;border:none;background:#676767;color:#212121;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
#send.ready{background:#fff}
#send:disabled{cursor:default}
.disclaimer{text-align:center;font-size:11.5px;color:#8e8e8e;padding:8px 0 2px}
/* sheet (tools) */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:50;padding:16px}
.sheet{background:#171717;border:1px solid #2f2f2f;border-radius:18px;width:min(680px,94vw);max-height:86vh;display:flex;flex-direction:column;overflow:hidden;color:#ececec}
.tabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid #2f2f2f;align-items:center}
.tab{border:none;background:none;font-size:13px;font-weight:600;padding:8px 12px;cursor:pointer;color:#8e8e8e;border-bottom:2px solid transparent}
.tab.on{color:#fff;border-bottom-color:#6EA8FF}
.sbody{padding:12px 16px;overflow-y:auto;font-size:13px;color:#ececec}
.jrow{display:flex;gap:8px;align-items:center;border:1px solid #2f2f2f;background:rgba(255,255,255,0.02);border-radius:10px;padding:8px 10px;margin:6px 0}
.jrow small{color:#8e8e8e}
.tbtn{font-size:11px;padding:5px 9px;border-radius:7px;border:1px solid #565656;background:transparent;color:#ececec;cursor:pointer;white-space:nowrap}
.tbtn:hover{border-color:#8e8e8e;background:#2f2f2f}
.tbtn.go{background:#fff;color:#111;border-color:#fff;font-weight:600}
.tinp{font-size:12px;padding:7px 9px;border-radius:8px;border:1px solid #565656;background:#212121;color:#ececec;color-scheme:dark}
.dot{width:8px;height:8px;border-radius:50%;background:#424242;flex-shrink:0}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#2f2f2f;border:1px solid #424242;color:#ececec;font-size:13px;padding:10px 18px;border-radius:12px;opacity:0;transition:opacity .3s;z-index:99;pointer-events:none}
@media(max-width:860px){
#side{position:fixed;top:0;bottom:0;left:0;transform:translateX(-102%);transition:transform .25s ease;box-shadow:8px 0 40px rgba(0,0,0,.5)}
#side.open{transform:none}
#scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
#burger{display:flex}
.sugg{grid-template-columns:1fr}
#newchat2{display:none}
}
@media(min-width:861px){#burger{display:none}#newchat2{display:flex}}
</style></head><body>
<div id="app">
<aside id="side">
  <div class="stop">
    <button class="iconbtn" id="sideclose" aria-label="Close sidebar">☰</button>
    <button id="newchat">✎&nbsp;&nbsp;New chat</button>
  </div>
  <input id="searchbox" placeholder="Search chats" autocomplete="off"/>
  <div id="hist"></div>
  <div class="side-foot">
    <div class="toolrow">
      <button class="tbtn" onclick="openSheet('sched')">Schedules</button>
      <button class="tbtn" onclick="openSheet('plug')">Plugins</button>
      <button class="tbtn" onclick="openSheet('agents')">Agents</button>
      <button class="tbtn" onclick="openSheet('keys')">Keys</button>
    </div>
    <div class="userrow"><span class="avatar">AC</span><span>Alex Chen</span></div>
  </div>
</aside>
<div id="scrim"></div>
<main>
  <header>
    <button class="iconbtn" id="burger" aria-label="Menu">☰</button>
    <button class="mname" id="mtitle">Chief of Staff <small>Treetiti CEO</small></button>
    <div class="hsp"></div>
    <button class="iconbtn" id="newchat2" aria-label="New chat">✎</button>
  </header>
  <div id="threadwrap"><div id="thread"></div>
    <div id="empty">
      <h1>What can I help with?</h1>
      <div class="sugg">
        <button data-q="Give me a status update: projects, approvals and anything blocked"><b>Status update</b>Projects, approvals, blockers</button>
        <button data-q="What AI providers and keys do we have configured?"><b>Providers &amp; keys</b>All 22 LLM connections</button>
        <button data-q="Draft three bold taglines for our AI order chat"><b>Create</b>Run the team on a task</button>
        <button data-q="What can you do? List your powers briefly."><b>Capabilities</b>Commands and powers</button>
      </div>
    </div>
  </div>
  <div id="composerwrap"><div id="composerbox">
    <div id="attachrow"></div>
    <div id="composer">
      <button class="iconbtn" id="plus" aria-label="Attach">+</button>
      <input type="file" id="filepick" class="hidden" style="display:none" multiple accept="image/*,.pdf,.doc,.docx,.txt,.md"/>
      <textarea id="t" rows="1" placeholder="Message Chief of Staff"></textarea>
      <button id="send" aria-label="Send" disabled>↑</button>
    </div>
    <div class="disclaimer">Chief of Staff can make mistakes. Check important info.</div>
  </div></div>
</main>
</div>
<div class="overlay" id="sheet"><div class="sheet">
<div class="tabs"><button class="tab" id="tab-sched" onclick="showTab('sched')">Schedules</button>
<button class="tab" id="tab-proj" onclick="showTab('proj')">Projects</button>
<button class="tab" id="tab-plug" onclick="showTab('plug')">Plugins</button>
<button class="tab" id="tab-agents" onclick="showTab('agents')">Agents</button>
<button class="tab" id="tab-keys" onclick="showTab('keys')">Keys</button>
<span style="flex:1"></span><button class="tbtn" onclick="closeSheet()">✕</button></div>
<div class="sbody" id="sbody"></div></div></div>
<div id="toast"></div>
<script>
const API='http://localhost:8091/api/v1';let TOK=null;
let curSession=null,curTitle='',lastGoal='',run=null,projList=[];
const attaches=[];
/* ---------- helpers ---------- */
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function md(src){
  let h=esc(src),out=[],code=[];
  h=h.replace(/```(\w*)\n([\s\S]*?)(```|$)/g,(m,l,c)=>{code.push('<pre><code>'+c.replace(/^\n+|\n+$/g,'')+'</code></pre>');return '\u0000'+(code.length-1)+'\u0000';});
  const lines=h.split('\n');let html='',inul=false,inol=false;
  const flush=()=>{if(inul){html+='</ul>';inul=false;}if(inol){html+='</ol>';inol=false;};};
  for(const ln of lines){
    let m;
    if(/^\u0000\d+\u0000$/.test(ln.trim())){flush();html+=code[+ln.trim().replace(/\u0000/g,'')];continue;}
    if(m=ln.match(/^###\s+(.*)/)){flush();html+='<h3>'+m[1]+'</h3>';continue;}
    if(m=ln.match(/^##\s+(.*)/)){flush();html+='<h2>'+m[1]+'</h2>';continue;}
    if(m=ln.match(/^#\s+(.*)/)){flush();html+='<h1>'+m[1]+'</h1>';continue;}
    if(m=ln.match(/^>\s?(.*)/)){flush();html+='<blockquote>'+m[1]+'</blockquote>';continue;}
    if(m=ln.match(/^(\d+)[.)]\s+(.*)/)){if(!inol){flush();html+='<ol>';inol=true;}html+='<li>'+m[2]+'</li>';continue;}
    if(m=ln.match(/^[-*]\s+(.*)/)){if(!inul){flush();html+='<ul>';inul=true;}html+='<li>'+m[1]+'</li>';continue;}
    if(!ln.trim()){flush();continue;}
    flush();html+='<p>'+ln+'</p>';
  }
  flush();
  html=html.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  return html.replace(/\u0000(\d+)\u0000/g,(m,i)=>code[+i]||m);
}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity='0',2200);}
async function api(path,body,method){const r=await fetch(API+path,{method:method||(body?'POST':'GET'),headers:{'Content-Type':'application/json',...(TOK?{Authorization:'Bearer '+TOK}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error(await r.text());return r.json();}
/* ---------- thread ---------- */
const thread=document.getElementById('thread'),emptyEl=document.getElementById('empty'),
      composerT=document.getElementById('t'),sendBtn=document.getElementById('send');
function syncEmpty(){emptyEl.style.display=thread.children.length?'none':'flex';}
function scrollBottom(){const w=document.getElementById('threadwrap');w.scrollTop=w.scrollHeight;}
function pushUser(text){const d=document.createElement('div');d.className='umsg';d.textContent=text;thread.appendChild(d);syncEmpty();scrollBottom();return d;}
function pushShell(){const d=document.createElement('div');d.className='amsg';d.innerHTML='<span class="cursor"></span>';thread.appendChild(d);syncEmpty();scrollBottom();return d;}
function setShell(div,full){div.innerHTML=md(full)+'<span class="cursor"></span>';scrollBottom();}
function finShell(div,full){div.innerHTML=md(full);scrollBottom();}
function pushBot(html){const d=document.createElement('div');d.className='amsg';d.innerHTML=html;thread.appendChild(d);syncEmpty();scrollBottom();return d;}
function actionRow(html){return '<div class="abtns">'+html+'</div>';}
/* ---------- sessions / history ---------- */
async function loadSessions(filter){let ss=[];try{ss=await api('/chat/sessions');}catch{ss=[];}
  const box=document.getElementById('hist');box.innerHTML='';
  const f=(filter||'').toLowerCase();
  const items=ss.filter(s=>!f||(s.title||'').toLowerCase().includes(f));
  if(!items.length){box.innerHTML='<div class="hsec">No chats yet</div>';return;}
  const sec=document.createElement('div');sec.className='hsec';sec.textContent='Chats';box.appendChild(sec);
  items.forEach(s=>{const b=document.createElement('button');b.className='hrow'+(s.id===curSession?' on':'');
    b.innerHTML='<span class="tt">'+esc(s.title||'New chat')+'</span><span class="ha"><button data-a="rn" title="Rename">✎</button><button data-a="del" title="Delete">×</button></span>';
    b.onclick=(e)=>{const a=e.target.closest('button[data-a]');
      if(a){e.stopPropagation();rowAction(s,a.dataset.a);return;}
      openSession(s.id,s.title);};
    box.appendChild(b);});
}
async function rowAction(s,a){
  if(a==='del'){if(!confirm('Delete this chat?'))return;
    try{await api('/chat/sessions/'+s.id,null,'DELETE');}catch(e){toast('Delete failed');return;}
    if(s.id===curSession)newChat();loadSessions(document.getElementById('searchbox').value);toast('Chat deleted');}
  else{const n=prompt('Rename chat:',s.title||'');if(!n||!n.trim())return;
    try{await api('/chat/sessions/'+s.id+'/rename',{title:n.trim()},'PATCH');}catch(e){toast('Rename failed');return;}
    if(s.id===curSession)setTitle(n.trim());loadSessions(document.getElementById('searchbox').value);}
}
function setTitle(t){curTitle=t;document.getElementById('mtitle').innerHTML=esc(t||'Chief of Staff')+' <small>Treetiti CEO</small>';}
function newChat(){curSession=null;run=null;thread.innerHTML='';setTitle('');syncEmpty();loadSessions(document.getElementById('searchbox').value);composerT.focus();}
async function openSession(id,title){let d;try{d=await api('/chat/sessions/'+id);}catch(e){toast('Could not open chat');return;}
  curSession=id;run=null;thread.innerHTML='';setTitle(d.title||title||'');
  (d.messages||[]).forEach(m=>{if(m.role==='user')pushUser(m.content||'');else pushBot(md(m.content||''));});
  syncEmpty();loadSessions(document.getElementById('searchbox').value);scrollBottom();}
/* ---------- composer ---------- */
function autoresize(){composerT.style.height='auto';composerT.style.height=Math.min(composerT.scrollHeight,200)+'px';
  sendBtn.disabled=!composerT.value.trim();sendBtn.classList.toggle('ready',!!composerT.value.trim());}
composerT.addEventListener('input',autoresize);
composerT.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
document.getElementById('send').onclick=()=>send();
document.getElementById('plus').onclick=()=>document.getElementById('filepick').click();
document.getElementById('filepick').addEventListener('change',e=>{
  [...e.target.files].forEach(f=>attaches.push({name:f.name,file:f}));
  e.target.value='';renderAttach();composerT.focus();});
function assetKind(name){const e=(name.split('.').pop()||'').toLowerCase();
  if(['png','jpg','jpeg','gif','webp','svg'].includes(e))return 'image';
  if(['mp4','mov','webm','m4v'].includes(e))return 'video';
  if(['mp3','wav','ogg','m4a'].includes(e))return 'audio';
  return '';}
async function logAttachments(){const jobs=attaches.map(a=>{const k=assetKind(a.name);if(!k)return null;
    const body={kind:k,title:a.name,creator_agent:'chief-of-staff'};if(curSession)body.session_id=curSession;
    return api('/assets',body).catch(()=>null);});
  const done=(await Promise.all(jobs)).filter(Boolean).length;
  if(done)toast(done+' attachment(s) logged to assets');}
function renderAttach(){const r=document.getElementById('attachrow');r.innerHTML='';
  attaches.forEach((a,i)=>{const s=document.createElement('span');
    s.style.cssText='font-size:12px;background:#2f2f2f;border:1px solid #565656;border-radius:16px;padding:5px 8px 5px 12px;color:#ececec;display:inline-flex;gap:8px;align-items:center';
    s.innerHTML=esc(a.name)+' <button style="border:none;background:none;color:#8e8e8e;cursor:pointer;font-size:13px">×</button>';
    s.querySelector('button').onclick=()=>{attaches.splice(i,1);renderAttach();};
    r.appendChild(s);});}
document.querySelectorAll('.sugg button').forEach(b=>b.onclick=()=>{composerT.value=b.dataset.q;autoresize();send();});
/* ---------- send + streaming ---------- */
async function send(e){if(e&&e.preventDefault)e.preventDefault();
  let goal=composerT.value.trim();if(!goal)return;
  if(attaches.length){await logAttachments();goal+='\n'+attaches.map(a=>'[ref: '+a.name+']').join(' ');attaches.length=0;renderAttach();}
  composerT.value='';autoresize();
  const cmd=goal.toLowerCase();
  if(/^clear$/.test(cmd)){thread.innerHTML='';run=null;syncEmpty();pushBot('Fresh canvas. What are we building?');return;}
  if(/^(new project|create project)$/.test(cmd)){newProject();return;}
  if(/^help$/.test(cmd)){pushBot('<strong>Commands:</strong> chat anything · <strong>Assemble the team</strong> under any reply runs it · <strong>delete this chat</strong> removes it · <strong>new project</strong> files one.');return;}
  doSend(goal,false);}
async function doSend(goal,confirm){lastGoal=goal;pushUser(goal);
  const div=pushShell();let full='',gotMsg=false,seenSession=false;
  try{
    const r=await fetch(API+'/chat/stream',{method:'POST',headers:{'Content-Type':'application/json',...(TOK?{Authorization:'Bearer '+TOK}:{})},body:JSON.stringify({message:goal,confirm:!!confirm,session_id:curSession})});
    if(!r.ok||!r.body)throw new Error('stream failed: '+r.status);
    const reader=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let idx;while((idx=buf.indexOf('\n\n'))>=0){const raw=buf.slice(0,idx);buf=buf.slice(idx+2);
        const ev=(raw.match(/^event:\s*(\w+)/m)||[])[1],dm=(raw.match(/^data:\s*(\{[\s\S]*\})/m)||[])[1];
        if(!ev||!dm)continue;let d;try{d=JSON.parse(dm);}catch{continue;}
        if(ev==='session'){curSession=d.session_id;seenSession=true;loadSessions(document.getElementById('searchbox').value);}
        else if(ev==='token'){full+=d.text||'';setShell(div,full);}
        else if(ev==='message'){gotMsg=true;finShell(div,'');handleReply(d,goal,div);}
      }}
    if(!gotMsg&&!full){div.remove();const d=await api('/chat',{message:goal,confirm:!!confirm});pushBot('');handleReply(d,goal,thread.lastChild);}
    else if(!gotMsg){finShell(div,full);}
  }catch(err){div.remove();localPlan(goal);}
  syncEmpty();scrollBottom();}
function handleReply(d,goal,div){
  if(d.chat_cleared){thread.innerHTML='';run=null;setTitle('');syncEmpty();pushBot(md(d.reply||'Done.'));loadSessions('');return;}
  if(d.confirmation_required){
    div.innerHTML=md(d.reply||'Confirm?')+actionRow('<button class="abtn primary" onclick="confirmAction(true)">Confirm</button><button class="abtn" onclick="confirmAction(false)">Cancel</button>');scrollBottom();return;}
  div.innerHTML=md(d.reply||'(empty reply)')+actionRow('<button class="abtn primary" onclick="assemble()">Assemble the team →</button>');scrollBottom();
  if(d.session_id&&!curSession){curSession=d.session_id;}
  if(!curTitle&&goal)setTitle(goal.slice(0,42));loadSessions(document.getElementById('searchbox').value);}

const attach={};
function chipsHTML(slot){const a=attach[slot];if(!a)return'';

  a.links.map((l,i)=>'<span style="font-size:12px;background:#2f2f2f;border:1px solid #565656;border-radius:16px;padding:4px 6px 4px 10px;color:#ececec;display:inline-flex;gap:6px;align-items:center">🔗 <a style="color:#6EA8FF" href="'+esc(l)+'" target="_blank">'+esc(shortUrl(l))+'</a><button onclick="rmLink(\''+slot+'\','+i+')" style="border:none;background:none;color:#8e8e8e;cursor:pointer">×</button></span>').join('')+
  a.files.map((f,i)=>'<span style="font-size:12px;background:#2f2f2f;border:1px solid #565656;border-radius:16px;padding:4px 6px 4px 10px;color:#ececec;display:inline-flex;gap:6px;align-items:center">📎 '+esc(f.name)+'<button onclick="rmFile(\''+slot+'\','+i+')" style="border:none;background:none;color:#8e8e8e;cursor:pointer">×</button></span>').join('')+'</div>';}
function shortUrl(u){try{const x=new URL(u);return x.hostname+x.pathname.slice(0,24);}catch{return u.slice(0,32);}}
function refreshChips(slot){const el=document.getElementById('chips-'+slot);if(el)el.innerHTML=chipsHTML(slot).replace(/^<div[^>]*>|<\/div>$/g,'');}
function addLink(slot){const inp=document.getElementById('lnk-'+slot);let v=(inp.value||'').trim();if(!v)return;
  if(!/^https?:\/\//i.test(v))v='https://'+v;attach[slot].links.push(v);inp.value='';refreshChips(slot);}
function addFiles(slot,input){[...input.files].forEach(f=>{attach[slot].files.push({name:f.name});});input.value='';refreshChips(slot);}
function rmLink(slot,i){attach[slot].links.splice(i,1);refreshChips(slot);}
function rmFile(slot,i){attach[slot].files.splice(i,1);refreshChips(slot);}
function renderQs(p){
  document.querySelectorAll('.qcardx').forEach(e=>e.remove());
  if(!p.pending_questions.length){if(p.status==='done')pushBot('<strong>Dossier ready</strong> — the team delivered.');return;}
  p.pending_questions.forEach((q,i)=>{attach[q.slot]={links:[],files:[]};
    const d=document.createElement('div');d.className='qcardx';
    d.innerHTML='<div class="qcard"><div style="font-size:11px;color:#8e8e8e;margin-bottom:4px">'+esc(q.agent)+'</div><div>'+esc(q.question)+'</div>'
    +'<input id="qa'+i+'" placeholder="Type answer…">'
    +'<div style="display:flex;gap:6px;margin-top:8px"><input id="lnk-'+q.slot+'" placeholder="Paste link…" style="flex:1"><button class="abtn" onclick="addLink(\''+q.slot+'\')">+ Link</button>'
    +'<label class="abtn" style="display:inline-block">+ File<input type="file" style="display:none" multiple accept="image/*,.pdf,.doc,.docx,.txt,.md" onchange="addFiles(\''+q.slot+'\',this)"></label></div>'
    +'<div id="chips-'+q.slot+'"></div></div>';
    thread.appendChild(d);});
  const btn=document.createElement('div');btn.className='qcardx';
  btn.innerHTML='<button class="abtn primary" id="qsend">Send answers → run agents</button>';
  thread.appendChild(btn);
  document.getElementById('qsend').onclick=()=>{const ans={};const parts=[];
    p.pending_questions.forEach((q,i)=>{const t=(document.getElementById('qa'+i)||{}).value||'';const a=attach[q.slot]||{links:[],files:[]};
      const mix=[t.trim(),...a.links.map(l=>'[link: '+l+']'),...a.files.map(f=>'[ref: '+f.name+']')].filter(Boolean).join(' ');
      if(mix)ans[q.slot]=mix;
      if(t.trim()||a.links.length||a.files.length)parts.push('<strong>'+esc(q.slot)+'</strong>: '+esc(t.trim()||a.links.join(', ')||a.files.map(f=>f.name).join(', ')));});
    document.querySelectorAll('.qcardx').forEach(e=>e.remove());
    if(Object.keys(ans).length)pushUser(parts.join('<br>'));answer(ans);};
  scrollBottom();}
